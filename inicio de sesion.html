<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petlink - Iniciar sesión</title>
<style>
body {
    font-family: 'Poppins', sans-serif;
    background-color: #dcdcdc;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    text-align: center;
    background-color: #f5f5f5;
    width: 450px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.header {
    background-color: #66c5d9;
    color: white;
    padding: 30px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    font-size: 28px;
    font-weight: bold;
}
.login-section {
    padding: 30px;
}
.login-section h2 {
    font-size: 20px;
    margin-bottom: 25px;
    color: #222;
}
label {
    display: block;
    font-size: 16px;
    text-align: left;
    margin: 10px 0 5px 10px;
    color: #333;
}
input {
    width: 90%;
    padding: 12px;
    border: 2px solid #a8e3ee;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    background-color: #fff;
    transition: all 0.3s;
}
input:focus {
    border-color: #5ac2d5;
    box-shadow: 0 0 5px #8ae6f0;
}
button {
    background-color: #66c5d9;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 20px;
    font-size: 17px;
    margin-top: 25px;
    cursor: pointer;
    transition: all 0.3s;
}
button:hover {
    background-color: #4fb3c7;
}
a {
    display: block;
    margin-top: 15px;
    color: #4fb3c7;
    text-decoration: none;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        Bienvenido a <br> Petlink
    </div>
    <div class="login-section">
        <h2>Inicio de sesión</h2>

        <!-- ✅ FORMULARIO CORREGIDO -->
        <form id="loginForm">
            <label for="usuario">Correo o nombre de usuario:</label>
            <input type="text" id="usuario" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>

            <button type="submit">Iniciar sesión</button>
        </form>

        <a href="registrarse.html">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</div>

<script>
// ✅ Validación e inicio de sesión con localStorage
document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();

  const userInput = document.getElementById("usuario").value.trim();
  const passInput = document.getElementById("password").value.trim();

  // Obtener usuarios guardados
  const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

  // Buscar usuario
  const encontrado = usuarios.find(u => 
    (u.nombre === userInput || u.correo === userInput) && u.contraseña === passInput
  );

  if (encontrado) {
    // Guardar usuario activo
    localStorage.setItem("usuarioActivo", encontrado.nombre);
    alert("Inicio de sesión exitoso ✅");
    window.location.href = "index.html";
  } else {
    alert("Usuario o contraseña incorrectos ❌");
  }
});
</script>

</body>
</html>
