<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PETLINK - Reportes</title>

<style>
/* ====== ESTILOS GENERALES (MISMO DISEÑO QUE INDEX) ====== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e6e6e6;
}

header {
  background: #5ac6d8;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav {
  display: flex;
  justify-content: space-around;
  background-color: #d9d9d9;
  padding: 10px 0;
}

nav button, nav a button {
  background: none;
  border: 1px solid #aaa;
  padding: 10px 20px;
  cursor: pointer;
  border-radius: 8px;
  font-size: 15px;
}

nav button:hover {
  background: #cfcfcf;
}

.main-content {
  padding: 20px;
}

.seccion {
  display: none;
}

/* ===== SUBMENÚ DE REPORTES ===== */
.sub-nav {
  text-align: center;
  margin-bottom: 20px;
}

.sub-nav button {
  background: #ffffff;
  border: 1px solid #999;
  border-radius: 10px;
  padding: 10px 15px;
  cursor: pointer;
  margin: 5px;
}

.sub-nav button:hover {
  background: #e9e9e9;
}

/* ===== CONTENEDORES DE SUBREPORTES ===== */
.subreporte {
  background: #f5f5f5;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.subreporte label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

.subreporte input,
.subreporte textarea,
.subreporte select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #999;
  margin-top: 5px;
  font-size: 14px;
}

button.enviar {
  margin-top: 20px;
  background: #64d1e3;
  border: none;
  padding: 12px;
  border-radius: 20px;
  cursor: pointer;
  color: white;
  font-size: 16px;
  width: 100%;
}

button.enviar:hover {
  background: #55b8c7;
}

#resultadosRecuperadas div {
  background:#eee;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}
</style>

</head>
<body>

<header>
  <a href="index.html" style="text-decoration:none;color:white;font-size:22px;">←</a>
  <h1 style="color:white;margin:0;">PETLINK</h1>
</header>

<!-- NAV -->
<nav>
  <a href="index.html"><button>Inicio</button></a>
  <button id="btnExclusivo" onclick="mostrarSeccion('seccionExclusiva')" style="display:none;">Exclusivo</button>
</nav>

<!-- ============= CONTENIDOS ============= -->

<div class="main-content">

  <!-- ========== REPORTES COMPLETOS ========== -->
  <div class="seccion" id="seccionReportes" style="display:block;">
    <h2>📊 Reportes</h2>

    <!-- SUBMENÚ -->
    <div class="sub-nav">
      <button onclick="mostrarSubReporte('reporteCalle')">Animal en situación de calle</button>
      <button onclick="mostrarSubReporte('reporteExtraviado')">Mascota extraviada</button>
      <button onclick="mostrarSubReporte('reporteRecuperadas')">Mascotas recuperadas</button>
      <button onclick="mostrarSubReporte('reporteAdopcion')">Solicitud de adopción</button>
    </div>

    <!-- ============ 1. ANIMALES EN CALLE ============ -->
    <div class="subreporte" id="reporteCalle" style="display:none;">
      <h3>🐾 Reportar animal en situación de calle</h3>

      <label>Tipo de animal:</label>
      <select id="tipoAnimal">
        <option>Perro</option>
        <option>Gato</option>
        <option>Otro</option>
      </select>

      <label>Último lugar visto:</label>
      <textarea id="lugarAnimal"></textarea>

      <label>Características:</label>
      <textarea id="caracteristicasAnimal"></textarea>

      <label>Fecha en que se vio:</label>
      <input type="date" id="fechaAnimal">

      <button class="enviar" onclick="guardarCalle()">Enviar reporte</button>
    </div>

    <!-- ============ 2. MASCOTA EXTRAVIADA ============ -->
    <div class="subreporte" id="reporteExtraviado" style="display:none;">
      <h3>🔍 Reportar mascota extraviada</h3>

      <label>Nombre:</label>
      <input type="text" id="nombreExtr">

      <label>Raza:</label>
      <input type="text" id="razaExtr">

      <label>Características:</label>
      <textarea id="caractExtr"></textarea>

      <label>Estado de salud:</label>
      <input type="text" id="saludExtr">

      <button class="enviar" onclick="guardarExtraviado()">Enviar reporte</button>
    </div>

    <!-- ============ 3. MASCOTAS RECUPERADAS ============ -->
    <div class="subreporte" id="reporteRecuperadas" style="display:none;">
      <h3>🐶 Mascotas recuperadas</h3>

      <label>Especie:</label>
      <input type="text" id="filtEspecie">

      <label>Color:</label>
      <input type="text" id="filtColor">

      <label>Ubicación:</label>
      <input type="text" id="filtUbic">

      <label>Fecha:</label>
      <input type="date" id="filtFecha">

      <button class="enviar" onclick="buscarRecuperadas()">Buscar</button>

      <div id="resultadosRecuperadas"></div>
    </div>

    <!-- ============ 4. SOLICITUD DE ADOPCIÓN (NUEVO) ============ -->
    <div class="subreporte" id="reporteAdopcion" style="display:none;">
      <h3>🐾 Solicitud de adopción</h3>

      <h3>Datos del adoptante</h3>

      <label>Nombre(s):</label>
      <input type="text" id="adopNombre">

      <label>Apellido paterno:</label>
      <input type="text" id="adopPaterno">

      <label>Apellido materno:</label>
      <input type="text" id="adopMaterno">

      <label>Edad:</label>
      <input type="number" id="adopEdad">

      <label>Estado civil:</label>
      <select id="adopEstadoCivil">
        <option value="">Seleccione</option>
        <option>Soltero(a)</option>
        <option>Casado(a)</option>
        <option>Divorciado(a)</option>
        <option>Unión libre</option>
        <option>Viudo(a)</option>
      </select>

      <label>Teléfono:</label>
      <input type="text" id="adopTelefono">

      <label>Calle:</label>
      <input type="text" id="adopCalle">

      <label>Colonia:</label>
      <input type="text" id="adopColonia">

      <label>Número:</label>
      <input type="text" id="adopNumero">

      <label>Código postal:</label>
      <input type="text" id="adopCP">

      <label>Estado:</label>
      <input type="text" id="adopEstado">

      <label>País:</label>
      <input type="text" id="adopPais">

      <h3>Cuestionario</h3>

      <label>1. ¿Por qué desea adoptar a esta mascota?</label>
      <textarea id="adopP1"></textarea>

      <label>2. ¿Qué tiempo pasaría sola la mascota al día?</label>
      <textarea id="adopP2"></textarea>

      <label>3. ¿Dónde vivirá la mascota?</label>
      <select id="adopP3">
        <option value="">Seleccione</option>
        <option>Departamento</option>
        <option>Casa</option>
        <option>Rancho</option>
        <option>Otro</option>
      </select>

      <label>4. ¿Las ventanas cuentan con protección?</label>
      <select id="adopP4">
        <option value="">Seleccione</option>
        <option>Sí</option>
        <option>No</option>
        <option>No aplica</option>
      </select>

      <label>5. ¿Qué tan seguido hará limpieza donde viva la mascota?</label>
      <select id="adopP5">
        <option value="">Seleccione</option>
        <option>Diario</option>
        <option>Cada 3 días</option>
        <option>Semanal</option>
        <option>Quincenal</option>
      </select>

      <label>6. ¿Tiene otras mascotas?</label>
      <select id="adopP6">
        <option value="">Seleccione</option>
        <option>Sí</option>
        <option>No</option>
      </select>

      <label>7. ¿Qué tipo de mascota tiene actualmente?</label>
      <select id="adopP7">
        <option value="">Seleccione</option>
        <option>Perro</option>
        <option>Gato</option>
        <option>Ave</option>
        <option>Reptil</option>
        <option>Otro</option>
      </select>

      <label>8. ¿Cuenta con recursos económicos para cubrir gastos?</label>
      <textarea id="adopP8"></textarea>

      <label>9. ¿Ha tenido mascotas anteriormente?</label>
      <select id="adopP9">
        <option value="">Seleccione</option>
        <option>Sí</option>
        <option>No</option>
      </select>

      <label>10. ¿Qué sucedió con su última mascota?</label>
      <textarea id="adopP10"></textarea>

      <label>11. ¿Está consciente de los cuidados necesarios?</label>
      <select id="adopP11">
        <option value="">Seleccione</option>
        <option>Sí</option>
        <option>No</option>
      </select>

      <label>12. En caso de mudanza o imprevisto, ¿qué pasará con la mascota?</label>
      <textarea id="adopP12"></textarea>

      <label>13. ¿Acepta visita de seguimiento?</label>
      <select id="adopP13">
        <option value="">Seleccione</option>
        <option>Sí</option>
        <option>No</option>
      </select>

      <label>14. Firma del adoptante:</label>
      <input type="text" id="adopFirma">

      <button class="enviar" onclick="guardarSolicitudAdopcion()">Enviar solicitud</button>
    </div>

  </div>

</div>

<!-- ================= JS ================= -->
<script>
function mostrarSubReporte(id) {
  document.querySelectorAll('.subreporte').forEach(div => div.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

/* === GUARDAR REPORTE 1 === */
function guardarCalle() {
  const data = {
    tipo: document.getElementById('tipoAnimal').value,
    lugar: document.getElementById('lugarAnimal').value,
    carac: document.getElementById('caracteristicasAnimal').value,
    fecha: document.getElementById('fechaAnimal').value
  };

  const lista = JSON.parse(localStorage.getItem("calle")) || [];
  lista.push(data);
  localStorage.setItem("calle", JSON.stringify(lista));

  alert("Reporte enviado con éxito");
}

/* === GUARDAR EXTRAVIADO === */
function guardarExtraviado() {
  const data = {
    nombre: document.getElementById('nombreExtr').value,
    raza: document.getElementById('razaExtr').value,
    carac: document.getElementById('caractExtr').value,
    salud: document.getElementById('saludExtr').value
  };

  const lista = JSON.parse(localStorage.getItem("extraviados")) || [];
  lista.push(data);
  localStorage.setItem("extraviados", JSON.stringify(lista));

  alert("Reporte enviado.");
}

/* === BUSCAR RECUPERADAS === */
function buscarRecuperadas() {
  const lista = JSON.parse(localStorage.getItem("recuperadas")) || [];

  const especie = document.getElementById('filtEspecie').value.toLowerCase();
  const color = document.getElementById('filtColor').value.toLowerCase();
  const ubic = document.getElementById('filtUbic').value.toLowerCase();
  const fecha = document.getElementById('filtFecha').value;

  const resultados = lista.filter(m =>
    (!especie || m.especie.toLowerCase().includes(especie)) &&
    (!color || m.color.toLowerCase().includes(color)) &&
    (!ubic || m.ubic.toLowerCase().includes(ubic)) &&
    (!fecha || m.fecha === fecha)
  );

  let html = "";
  resultados.forEach(r => {
    html += `
      <div>
        <strong>Especie:</strong> ${r.especie}<br>
        <strong>Color:</strong> ${r.color}<br>
        <strong>Ubicación:</strong> ${r.ubic}<br>
        <strong>Fecha:</strong> ${r.fecha}
      </div>
    `;
  });

  document.getElementById('resultadosRecuperadas').innerHTML =
    resultados.length ? html : "No se encontraron coincidencias.";
}

/* === GUARDAR SOLICITUD DE ADOPCIÓN === */
function guardarSolicitudAdopcion() {

  const data = {
    nombre: document.getElementById('adopNombre').value,
    paterno: document.getElementById('adopPaterno').value,
    materno: document.getElementById('adopMaterno').value,
    edad: document.getElementById('adopEdad').value,
    estadoCivil: document.getElementById('adopEstadoCivil').value,
    telefono: document.getElementById('adopTelefono').value,
    calle: document.getElementById('adopCalle').value,
    colonia: document.getElementById('adopColonia').value,
    numero: document.getElementById('adopNumero').value,
    cp: document.getElementById('adopCP').value,
    estado: document.getElementById('adopEstado').value,
    pais: document.getElementById('adopPais').value,

    p1: document.getElementById('adopP1').value,
    p2: document.getElementById('adopP2').value,
    p3: document.getElementById('adopP3').value,
    p4: document.getElementById('adopP4').value,
    p5: document.getElementById('adopP5').value,
    p6: document.getElementById('adopP6').value,
    p7: document.getElementById('adopP7').value,
    p8: document.getElementById('adopP8').value,
    p9: document.getElementById('adopP9').value,
    p10: document.getElementById('adopP10').value,
    p11: document.getElementById('adopP11').value,
    p12: document.getElementById('adopP12').value,
    p13: document.getElementById('adopP13').value,
    firma: document.getElementById('adopFirma').value
  };

  const lista = JSON.parse(localStorage.getItem("solicitudesAdopcion")) || [];
  lista.push(data);
  localStorage.setItem("solicitudesAdopcion", JSON.stringify(lista));

  alert("Solicitud de adopción enviada con éxito.");
}
</script>

</body>
</html>
