<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETLINK - Configuración</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #e0e0e0;
    }

    header {
      background-color: #6ec5d8;
      color: white;
      text-align: right;
      padding: 15px 20px;
      font-size: 24px;
      position: relative;
    }

    .back-arrow {
      position: absolute;
      left: 15px;
      top: 12px;
      font-size: 28px;
      color: white;
      text-decoration: none;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #ccc;
    }

    nav a {
      flex: 1;
      text-align: center;
      padding: 12px;
      text-decoration: none;
      color: black;
      border-right: 1px solid #aaa;
      font-weight: bold;
    }

    nav a:last-child {
      border-right: none;
    }

    .container {
      display: flex;
      justify-content: center;
      padding: 30px 0;
    }

    .buttons {
      background-color: white;
      padding: 30px 50px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .buttons button {
      display: block;
      width: 250px;
      padding: 12px;
      margin: 12px auto;
      font-size: 16px;
      background-color: #d6d6d6;
      border: none;
      border-radius: 6px;
      box-shadow: 2px 2px 3px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .buttons button:hover {
      background-color: #c5c5c5;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-arrow">&#8592;</a>
    PETLINK
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="index.html">Perreras</a>
    <a href="index.html">Usuarios</a>
    <a href="index.html">Sobre nosotros</a>
  </nav>

  <div class="container">
    <div class="buttons">
      <button id="btnAvisos">Avisos y privacidad</button>
      <button id="btnTerminos">Términos y condiciones</button>
      <button id="btnNotificaciones">Notificaciones</button>
      <button id="btnPerfil">Sobre el perfil de usuario</button>
    </div>
  </div>

  <script>
    // Espera que el documento cargue antes de asignar eventos
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("btnAvisos").addEventListener("click", () => {
        window.location.href = "avisos.html";
      });

      document.getElementById("btnTerminos").addEventListener("click", () => {
        window.location.href = "terminos.html";
      });

      document.getElementById("btnNotificaciones").addEventListener("click", () => {
        window.location.href = "notificaciones.html";
      });

      document.getElementById("btnPerfil").addEventListener("click", () => {
        window.location.href = "perfil.html";
      });

    });
  </script>
</body>
</html>
