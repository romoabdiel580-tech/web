<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETLINK - Notificaciones</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #e0e0e0;
    }

    header {
      background-color: #6ec5d8;
      color: white;
      text-align: right;
      padding: 15px 20px;
      font-size: 24px;
      position: relative;
    }

    .back-arrow {
      position: absolute;
      left: 15px;
      top: 12px;
      font-size: 28px;
      color: white;
      text-decoration: none;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #ccc;
    }

    nav a {
      flex: 1;
      text-align: center;
      padding: 12px;
      text-decoration: none;
      color: black;
      border-right: 1px solid #aaa;
      font-weight: bold;
    }

    nav a:last-child {
      border-right: none;
    }

    .container {
      text-align: center;
      padding: 60px 20px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 30px;
    }

    label {
      font-size: 18px;
      margin-left: 10px;
    }

    input[type="checkbox"] {
      transform: scale(1.3);
    }

    .save-btn {
      display: block;
      margin: 40px auto;
      padding: 12px 30px;
      font-size: 16px;
      color: white;
      background-color: #6ec5d8;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      transition: background-color 0.2s ease;
    }

    .save-btn:hover {
      background-color: #5bb5c8;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-arrow">&#8592;</a>
    PETLINK
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="#">Perreras</a>
    <a href="#">Usuarios</a>
    <a href="#">Sobre nosotros</a>
  </nav>

  <div class="container">
    <h2>Notificaciones</h2>
    <form id="formNotificaciones">
      <input type="checkbox" id="activarNotificaciones">
      <label for="activarNotificaciones">Activar notificaciones</label>
      <button type="submit" class="save-btn">Guardar cambios</button>
    </form>
  </div>

  <script>
    // Cargar estado actual
    const checkNotificaciones = document.getElementById("activarNotificaciones");
    const estadoGuardado = localStorage.getItem("notificacionesActivas") === "true";
    checkNotificaciones.checked = estadoGuardado;

    // Guardar estado al enviar formulario
    document.getElementById("formNotificaciones").addEventListener("submit", (e) => {
      e.preventDefault();
      const activadas = checkNotificaciones.checked;
      localStorage.setItem("notificacionesActivas", activadas);

      if (activadas) {
        alert("🔔 Notificaciones activadas correctamente.");
      } else {
        alert("🔕 Notificaciones desactivadas.");
      }

      // Redirige de nuevo al index
      window.location.href = "index.html";
    });

  </script>
</body>
</html>
